name: deploy

# Pull requests get their own throwaway URL on a preview channel. Merges to
# main go live. This is what replaces a standing staging environment.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  PROJECT_ID: firetower-prod-506201
  HOSTING_TARGET: prod

concurrency:
  # A newer commit supersedes an in-flight deploy of an older one.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & deploy
    runs-on: ubuntu-latest
    # A fork's PR cannot be given an OIDC token, and should not be trusted with
    # one anyway. Skip rather than fail with a confusing auth error.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: assert the export is complete and indexable
        # `output: export` fails open in one specific way: if a route quietly
        # stops being static, the build can still succeed while emitting no
        # file for it. And nothing in a build fails when a page loses its
        # canonical, its description, or its JSON-LD — those fail silently,
        # weeks later, in Search Console. scripts/check-seo.mjs turns both
        # back into build errors. Run it locally with `npm run check:seo`.
        run: npm run check:seo

      - uses: google-github-actions/auth@v2
        with:
          project_id: firetower-prod-506201
          workload_identity_provider: projects/44468657204/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: website-deployer-prod@firetower-prod-506201.iam.gserviceaccount.com

      - name: install firebase cli
        run: npm install -g firebase-tools@15

      # ---- preview channel, for PRs -------------------------------------
      - name: deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          set -e
          channel="pr-${{ github.event.pull_request.number }}"
          firebase hosting:channel:deploy "$channel" \
            --project "$PROJECT_ID" \
            --only "$HOSTING_TARGET" \
            --expires 7d \
            --json > channel.json
          url=$(node -e "const j=require('./channel.json');const r=Object.values(j.result)[0];console.log(r.url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"

      - name: comment preview url
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- hosting-preview -->';
            const url = '${{ steps.preview.outputs.url }}';
            const body = marker + '\n### Preview deployed\n\n' + url + '\n\n_Expires in 7 days. Updates on every push to this PR._';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body });
            }

      # ---- live, on main -------------------------------------------------
      - name: deploy live
        if: github.event_name != 'pull_request'
        run: |
          firebase deploy \
            --project "$PROJECT_ID" \
            --only "hosting:$HOSTING_TARGET" \
            --message "${{ github.sha }}"
          echo "### Deployed to https://usefiretower.com" >> "$GITHUB_STEP_SUMMARY"
